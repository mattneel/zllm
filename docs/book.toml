[book]
title = "zllm"
description = "Portable inference from one Zig core, with accuracy gates and hardware-specific backends"
authors = ["Matt Neel"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/mattneel/zllm"
edit-url-template = "https://github.com/mattneel/zllm/edit/master/docs/{path}"
site-url = "/zllm/"
mathjax-support = true
additional-js = ["theme/mermaid-init.js"]
