<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zllm</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 52rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        border: 1px solid #8884;
        border-radius: 0.5rem;
      }
      #model-url {
        flex: 1 1 20rem;
      }
      progress {
        width: 100%;
      }
      #log {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin: 1rem 0;
      }
      .msg {
        white-space: pre-wrap;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: #8881;
      }
      .user {
        align-self: flex-end;
        background: #4a7cff22;
      }
      .reasoning {
        opacity: 0.6;
        font-size: 0.9em;
      }
      #prompt {
        width: 100%;
        min-height: 4rem;
        box-sizing: border-box;
      }
      #stats {
        font-family: ui-monospace, monospace;
        font-size: 0.85em;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>zllm</h1>
    <fieldset id="load-form">
      <select id="model-pick" aria-label="Model">
        <option value="https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/807dfd9a6fadbf703207aac3bfb0b2b3040d077c/Qwen3.5-0.8B-BF16.gguf">Qwen3.5 0.8B BF16 (1.6 GB)</option>
        <option value="https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/50968a4468ef4233ed78cd7c3de230dd1d61a56b/Qwen3-0.6B-BF16.gguf">Qwen3 0.6B BF16 (1.2 GB)</option>
        <option value="https://huggingface.co/unsloth/Llama-3.2-1B-Instruct-GGUF/resolve/b69aef112e9f895e6f98d7ae0949f72ff09aa401/Llama-3.2-1B-Instruct-BF16.gguf">Llama 3.2 1B Instruct BF16 (2.5 GB)</option>
        <option value="https://huggingface.co/ibm-granite/granite-4.2-3b-GGUF/resolve/c40945d71cd90f249a56985e8155551a9188dc30/granite-4.2-3b-bf16.gguf">Granite 4.2 3B BF16 (6.8 GB)</option>
        <option value="https://huggingface.co/ibm-granite/granite-4.2-30b-GGUF/resolve/27b350a791e81d9a4d1ddca1c49282e9ec533768/granite-4.2-30b-Q4_K_M.gguf">Granite 4.2 30B Q4_K_M (17.7 GB)</option>
        <option value="https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/ab8d7bd81d03117501e4da60cccdff4c80f0eea0/RVN-Q3_K_M-mtp.gguf">Qwen3.8 27B Q3_K_M with MTP (13.8 GB)</option>
      </select>
      <input id="model-url" value="https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/807dfd9a6fadbf703207aac3bfb0b2b3040d077c/Qwen3.5-0.8B-BF16.gguf" aria-label="Model URL" />
      <button id="load-url">Load URL</button>
      <input id="model-file" type="file" accept=".gguf" aria-label="Model file" />
      <button id="clear-cache" type="button">Clear cache</button>
    </fieldset>
    <p id="status">WebGPU, GGUF in, tokens out. Pick a model, paste a GGUF URL, or open a file.</p>
    <progress id="progress" value="0" max="1" hidden></progress>
    <div id="log"></div>
    <form id="chat" hidden>
      <textarea id="prompt" placeholder="Message"></textarea>
      <label><input id="think" type="checkbox" checked /> Thinking</label>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="reset" type="button">New chat</button>
    </form>
    <p id="stats"></p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
