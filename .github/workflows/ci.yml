name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  zig:
    name: Zig fmt + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check .
      - run: zig build test --summary all

  tokenizer:
    name: Tokenizer parity (Hugging Face)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/cache@v6
        with:
          path: .fixtures
          key: fixtures-vocab-${{ hashFiles('scripts/fixtures.sh') }}
      - run: scripts/fixtures.sh vocab
      - run: zig build check-tokenizer

  web:
    name: TypeScript (Biome + tsc)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  book:
    name: Book
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bundle book scripts
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:book
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: Deploy book to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [zig, tokenizer, web, book]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
