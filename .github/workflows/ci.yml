name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  zig:
    name: Zig fmt, unit tests, wasm build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check .
      - run: zig build test --summary all
      - run: zig build wasm

  tokenizer:
    name: Tokenizer and chat template parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      # setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/cache@v6
        with:
          path: .fixtures
          key: fixtures-vocab-${{ hashFiles('scripts/fixtures.sh') }}
      - run: scripts/fixtures.sh vocab
      - run: zig build check-tokenizer
      - run: zig build check-chat

  gpu-kernels:
    name: GPU fast tier (Dawn on llvmpipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - name: Install the Vulkan loader and Mesa's software driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache@v6
        with:
          path: .fixtures/dawn
          key: fixtures-dawn-${{ hashFiles('scripts/fixtures.sh') }}
      - run: scripts/fixtures.sh dawn
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/cache@v6
        with:
          path: |
            .fixtures/models
            .fixtures/hf
          key: fixtures-model-${{ hashFiles('scripts/fixtures.sh') }}
      - run: scripts/fixtures.sh vocab && scripts/fixtures.sh model
      # The CPU reference's outputs (tools/common.py cached_reference), keyed
      # by what produces them; a reference change recomputes them.
      - uses: actions/cache@v6
        with:
          path: .fixtures/cache
          key: references-${{ hashFiles('src/ref/**', 'src/gguf/**', 'src/graph/**', 'src/main.zig', 'build.zig', 'build.zig.zon', 'tools/corpus/**') }}
          restore-keys: references-
      # gpu-check, then the first eval text through both kernel paths, the
      # step splits and every KV format, against the CPU reference.
      - run: zig build check-fast -Dengine-check=false

  web:
    name: TypeScript (Biome + tsc)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  book:
    name: Book
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bundle book scripts
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:book
      - run: mdbook build docs
      # The chat demo at /demo/: zllm.wasm and the demo page, streaming the
      # model from Hugging Face.
      - run: zig build wasm
      - name: Bundle the demo
        working-directory: web
        run: bun run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: Deploy book to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # The llvmpipe tier (gpu-kernels) runs on its own: the book does not wait.
    needs: [zig, tokenizer, web, book]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
